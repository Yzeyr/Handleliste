<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e2236" />
    <meta name="description" content="Når og hvor du bør fiske: bitepoeng time for time ut fra sol, måne, lufttrykk og vær." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bitetid" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="icons/icon-180.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Bitetid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <link rel="stylesheet" href="styles.css?v=c3125679f8" />
  </head>
  <body>
    <header class="top">
      <canvas id="skyfx" class="skyfx" aria-hidden="true"></canvas>
      <div class="top-inner">
        <button type="button" class="place" data-act="place" aria-label="Velg vann">
          <span id="place-name" class="place-name">Bitetid</span>
          <span id="place-detail" class="place-detail"></span>
        </button>
        <button type="button" id="refresh" class="round" data-act="refresh" aria-label="Hent været på nytt">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
      </div>
      <p id="status" class="status" role="status"></p>
      <div id="treeline" class="treeline-wrap"></div>
    </header>

    <main id="view" class="view"></main>

    <section id="mapview" class="mapview" hidden>
      <div id="map" class="map"></div>
      <button type="button" class="round map-locate" data-act="locate" aria-label="Vis min posisjon">◎</button>
      <div id="spot-list" class="spot-list"></div>
      <section id="offline-maps" class="card offline-card"></section>
    </section>

    <nav id="tabs" class="tabs" aria-label="Visninger"></nav>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-panel" role="dialog" aria-modal="true">
        <button type="button" class="sheet-close" data-act="close" aria-label="Lukk">×</button>
        <div id="sheet-body"></div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
    <script type="module" src="src/main.js?v=c3125679f8"></script>
  </body>
</html>
